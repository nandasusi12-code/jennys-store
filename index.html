<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny's Store</title>

    <style>
        body {
            background-color: #f8f5f0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #40372f;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #8b6f54;
            font-size: 36px;
            letter-spacing: 3px;
        }

        .product {
            background-color: white;
            max-width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
        }

        .price {
            color: #8b6f54;
            font-weight: bold;
            font-size: 20px;
        }

        button {
            background-color: #8b6f54;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6d543d;
        }
    </style>
</head>

<body>
    <h1>JENNY'S STORE</h1>
    <p>Temukan produk favoritmu di sini.</p>

    <div class="product">
        <h2>Tote Bag Minimalis</h2>
        <p>Tas simpel untuk menemani aktivitasmu.</p>
        <p class="price">Rp35.000</p>
        <button>Beli Sekarang</button>
    </div>

    <p>Terima kasih sudah berkunjung ♡</p>
</body>
</html>
